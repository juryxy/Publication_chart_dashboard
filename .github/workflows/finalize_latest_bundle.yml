name: Finalize latest application bundle

on:
  push:
    branches: [main]
    paths:
      - '.bundle_upload/**'
      - '.github/workflows/finalize_latest_bundle.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app_bundle
          cat .bundle_upload/chunk_00.txt \
              .bundle_upload/chunk_01.txt \
              .bundle_upload/chunk_02.txt \
              .bundle_upload/chunk_03.txt \
              .bundle_upload/chunk_04.txt \
              .bundle_upload/chunk_05.txt \
              .bundle_upload/chunk_06.txt \
              .bundle_upload/chunk_07.txt \
              .bundle_upload/chunk_08.txt \
              .bundle_upload/chunk_09.txt \
              .bundle_upload/chunk_10.txt \
              .bundle_upload/chunk_11.txt > app_bundle/app.b64
          python - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib
          bundle = Path('app_bundle/app.b64').read_bytes()
          expected_bundle_git = 'd62b1d81f789d62c677fc61c71e7d63a42a7ec7f'
          got_bundle_git = hashlib.sha1(b'blob ' + str(len(bundle)).encode() + b'\0' + bundle).hexdigest()
          assert got_bundle_git == expected_bundle_git, (got_bundle_git, expected_bundle_git)
          source = bz2.decompress(base64.b64decode(bundle))
          assert len(source) == 212337, len(source)
          expected_source_sha = '724fab07798490911fcad2d6b7f6491dd9c77375616220f8a06729a68da36029'
          got_source_sha = hashlib.sha256(source).hexdigest()
          assert got_source_sha == expected_source_sha, (got_source_sha, expected_source_sha)
          compile(source.decode('utf-8'), 'app_source.py', 'exec')
          print('verified bundle git sha:', got_bundle_git)
          print('verified source sha256:', got_source_sha)
          PY
      - name: Remove staging files and finalize release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bundle_upload
          rm -f .github/workflows/finalize_latest_bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release axis and control integration fixes'
          git push
