name: Finalize latest application bundle

on:
  push:
    branches: [main]
    paths:
      - '.bundle_upload/**'
      - '.github/workflows/finalize_latest_bundle.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d .bundle_upload
          cat .bundle_upload/chunk_*.txt > app_bundle/app.b64
          actual_blob="$(git hash-object app_bundle/app.b64)"
          test "$actual_blob" = "01951a2e02abc22933dcd75a4ce95194c2a28e7a"
          python - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib
          encoded = Path('app_bundle/app.b64').read_text(encoding='ascii')
          source = bz2.decompress(base64.b64decode(encoded))
          assert len(source) == 208494, len(source)
          assert hashlib.sha256(source).hexdigest() == '6bb00329d7939b5f2923f8f42af5d4b08affbb5927d6968ccbae9135cdb7458d'
          compile(source.decode('utf-8'), 'app_source.py', 'exec')
          print('verified source sha256:', hashlib.sha256(source).hexdigest())
          PY
      - name: Remove staging and previous bundle variants
        shell: bash
        run: |
          set -euo pipefail
          find app_bundle -maxdepth 1 -type f ! -name 'app.b64' -delete
          rm -rf app_bundle_v2 .bundle_upload
          rm -f RENDERER_AUDIT.md
          rm -f .github/workflows/finalize_latest_bundle.yml
      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release multi-Y and longitudinal CI fixes'
          git push
